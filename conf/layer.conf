# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "indcomms-ibv"
BBFILE_PATTERN_indcomms-ibv = "^${LAYERDIR}/"
BBFILE_PRIORITY_indcomms-ibv = "24"
LAYERSERIES_COMPAT_indcomms-ibv = "scarthgap"
LAYERDEPENDS_indcomms-ibv = "phytec ampliphy"

DISTRO_VERSION:append = "-indcomms-v0.1"
